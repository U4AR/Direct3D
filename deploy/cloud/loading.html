<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draw3D · Opening workspace</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,#19333b,#10191f 70%);color:#e6f0f3;font:16px/1.6 system-ui,sans-serif}main{width:min(470px,100%);background:#16282fee;border:1px solid #3b565f;border-radius:22px;padding:36px}header{color:#a4e6d1;font-weight:750;letter-spacing:.12em;font-size:13px}h1{font-size:29px;line-height:1.2;margin:24px 0 16px}p{color:#b0c8d0}.spinner{width:36px;height:36px;border:3px solid #a4e6d133;border-top-color:#a4e6d1;border-radius:50%;animation:spin 1s linear infinite;margin:26px 0}li{color:#7898a5;margin:10px 0}li[aria-current=step]{color:#c6f3e7}small{color:#91aeb9}button{padding:12px 18px;border:0;border-radius:9px;background:#a4e6d1;color:#14372c;font-weight:700;cursor:pointer}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-style:dotted}}</style></head><body><main aria-busy="true"><header>◇ DRAW3D</header><div class="spinner" aria-hidden="true"></div><h1>Opening your private workspace</h1><p id="loading-status" role="status" aria-live="polite">Checking your sign-in…</p><ol><li id="step-account">Check your account</li><li id="step-runtime">Wake up your workspace</li><li id="step-tools">Load drawing and CAD tools</li></ol><button id="loading-retry" hidden>Try again</button><p><small>After an idle period, the workspace starts on demand. Your saved work is kept while it wakes up.</small></p></main><script src="/learn/loading.js" defer></script></body></html>
