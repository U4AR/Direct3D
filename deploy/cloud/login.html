<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Draw3D · Sign in</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#10191f;color:#e9f1f4;font:16px system-ui,sans-serif;padding:24px}main{width:min(440px,100%);padding:36px;background:#17252e;border:1px solid #30434e;border-radius:20px}header{font-weight:750;letter-spacing:.1em;color:#92d8c9}h1{font-size:30px;line-height:1.2;margin:32px 0 12px}p{color:#adc0ca;line-height:1.6}label{display:block;margin:24px 0 9px;font-size:14px}input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #526b77;background:#0e1a21;color:white;font-size:20px;letter-spacing:.16em;outline-offset:4px}button{cursor:pointer;border:0;border-radius:9px;padding:12px 16px;background:#92d8c9;color:#10211d;font-weight:650;font-size:15px}#google{margin:25px 0 8px;min-height:44px}#status{min-height:3em;font-size:14px;white-space:pre-line}small{color:#8aa1ad;font-size:12px;line-height:1.6;display:block;margin-top:24px}a{color:#92d8c9}button:disabled{opacity:.55;cursor:wait}</style></head><body><main><header>◇ DRAW3D</header><h1>Make room for your ideas.</h1><p>Use your Google account and invitation passcode to open your private 3D workspace.</p><label for="passcode">Invitation passcode</label><input id="passcode" type="password" inputmode="numeric" pattern="[0-9]{8,12}" autocomplete="off" maxlength="12" placeholder="Enter your passcode"><div id="google"></div><p id="status" role="status" aria-live="polite"></p><small>Your drawings and generated models belong to your signed-in workspace. The workspace may take a little time to wake up after a break.</small></main><script src="/auth/login.js" defer></script></body></html>
